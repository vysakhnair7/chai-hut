# All values come from your .env file (copy .env.example). Nothing secret lives in this file.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Kolkata}
      DEFAULT_GST_RATE: ${DEFAULT_GST_RATE:-5.00}
      MANAGER_SALES_WINDOW_DAYS: ${MANAGER_SALES_WINDOW_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      OWNER_USERNAME: ${OWNER_USERNAME:?set OWNER_USERNAME in .env}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?set OWNER_PASSWORD in .env}
      OWNER_FULL_NAME: ${OWNER_FULL_NAME:-Chai Hut Owner}
    ports:
      - "8000:8000"

  # Throwaway database + test run:  docker compose --profile test run --rm tests
  test-db:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chai_hut_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d chai_hut_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  tests:
    profiles: ["test"]
    build: .
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@test-db:5432/chai_hut_test
    command: ["python", "-m", "pytest", "-q"]

volumes:
  pgdata:
